# ==============================================================================
# Karpenter GPU NodePool & NodeClass Specification (Plane 8: Node Autoscaling)
# ==============================================================================
# Solves the critical physical limit:
# "Scaling 1 to N pods on one GTX 1650 is impossible. Pod autoscaling only helps
# when there are GPUs to land on. Real scaling needs a GPU node pool and Karpenter."
# ==============================================================================

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-inference-nodepool
spec:
  template:
    metadata:
      labels:
        workload: llm-inference
        gpu-node: "true"
    spec:
      nodeClassRef:
        name: gpu-nodeclass
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["g", "p"]                      # AWS G5 (A10G) or G6 (L4) instance families
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["g5", "g6"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand", "spot"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
      taints:
        - key: nvidia.com/gpu
          value: "present"
          effect: NoSchedule
  limits:
    nvidia.com/gpu: 16                           # Max 16 GPUs in cluster
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h                            # 30 days
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: gpu-nodeclass
spec:
  amiFamily: AL2
  role: "KarpenterNodeRole-LLMOps"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "llmops-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "llmops-cluster"
  blockDeviceMappings:
    # High-throughput NVMe disk mapping for local Hugging Face model weight cache
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        iops: 5000
        throughput: 250
        deleteOnTermination: true
