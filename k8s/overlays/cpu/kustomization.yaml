# CPU: llama.cpp server with GGUF weights (x86_64 / arm64 nodes, no accelerator).
# Same engine contract as vLLM - Service vllm:8000, OpenAI API, /health, /metrics - so
# router, gateway, Prometheus rules and KEDA are unchanged. The pinned GGUF build comes
# from the model block (GGUF_REPO / GGUF_FILE / GGUF_REVISION in the llmops-model
# ConfigMap) and is cached on the model PVC under gguf/ (mounted at /models).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vllm/vllm-openai
    newName: ghcr.io/ggml-org/llama.cpp
    newTag: server-b10902
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - >-
            exec /app/llama-server
            --model-url "https://huggingface.co/$GGUF_REPO/resolve/$GGUF_REVISION/$GGUF_FILE"
            --model "/models/$GGUF_FILE"
            --alias "$SERVED_MODEL_NAME"
            --ctx-size "${LLAMACPP_CTX:-16384}"
            --parallel "${LLAMACPP_PARALLEL:-4}"
            --kv-unified
            --metrics
            --host 0.0.0.0
            --port 8000
            $LLAMACPP_MODEL_ARGS $LLAMACPP_EXTRA_ARGS
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: model-cache, mountPath: /models, subPath: gguf}
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "4"
            memory: 8Gi
