# NVIDIA CUDA on clusters that expose the NVIDIA container runtime as a RuntimeClass
# (k3s / containerd with the NVIDIA Container Toolkit). Chosen automatically by
# scripts/deploy_k8s.sh when `kubectl get runtimeclass nvidia` succeeds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../cuda
patches:
  - target: {kind: Deployment, name: vllm}
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: nvidia
