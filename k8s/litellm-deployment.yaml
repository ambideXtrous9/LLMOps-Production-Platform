apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llmops
data:
  config.yaml: |
    model_list:
      - model_name: smollm2
        litellm_params:
          model: openai/HuggingFaceTB/SmolLM2-360M-Instruct
          api_base: http://kv-router-service.llmops.svc.cluster.local:8000/v1
          api_key: "none"
          timeout: 30
          max_retries: 3
          stream: true

    router_settings:
      routing_strategy: "least-busy"
      num_retries: 3
      timeout: 30

    litellm_settings:
      success_callback: ["prometheus", "otel", "langfuse"]
      failure_callback: ["prometheus", "otel", "langfuse"]
      cache: true
      cache_type: "redis"
      redis_url: os.environ/REDIS_URL
      otel:
        endpoint: http://tempo.llmops.svc.cluster.local:4317
        service_name: "litellm-gateway"

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-deployment
  namespace: llmops
  labels:
    app: litellm
    plane: ingress-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
            - --num_workers
            - "2"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: DATABASE_URL
              value: "postgresql://llmops_admin:llmops_production_secure_pass_2026@postgres-service.llmops.svc.cluster.local:5432/litellm_db"
            - name: REDIS_URL
              value: "redis://:redis_cluster_production_pass_2026@redis-service.llmops.svc.cluster.local:6379"
          ports:
            - containerPort: 4000
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-service
  namespace: llmops
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30040
