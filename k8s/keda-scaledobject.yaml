apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-inference-scaler
  namespace: llmops
  labels:
    app: vllm
    tier: inference
    plane: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-deployment
  minReplicaCount: 1
  maxReplicaCount: 8
  
  # ----------------------------------------------------------------------------
  # Stabilization Windows: Prevents Thrashing During Cold Starts
  # ----------------------------------------------------------------------------
  # LLM weight loading takes 15-90 seconds. A generous cooldown window avoids
  # killing warm pods while continuous batching is draining requests.
  cooldownPeriod: 300
  pollingInterval: 15

  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
            - type: Pods
              value: 1
              periodSeconds: 60
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 2
              periodSeconds: 15
          selectPolicy: Max

  triggers:
    # --------------------------------------------------------------------------
    # Trigger 1: Normalized Queue Backlog Per Active Replica
    # --------------------------------------------------------------------------
    # Evaluates waiting requests DIVIDED by active replicas.
    # Eliminates the flaw of scaling on aggregate queue alone.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-service.llmops.svc.cluster.local:9090
        metricName: vllm_queue_backlog_per_replica
        query: >-
          sum(vllm:num_requests_waiting)
          /
          clamp_min(count(count by (instance) (vllm:num_requests_running)), 1)
        threshold: '4'

    # --------------------------------------------------------------------------
    # Trigger 2: KV-Cache Saturation Factor
    # --------------------------------------------------------------------------
    # KV cache is the true saturation signal for LLM continuous batching.
    # Triggers scale-out when average KV cache utilization exceeds 80%
    # BEFORE requests begin backing up in the queue.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-service.llmops.svc.cluster.local:9090
        metricName: vllm_kv_cache_saturation_percent
        query: >-
          avg(vllm:gpu_cache_usage_factor) * 100
        threshold: '80'
