# ==============================================================================
# Inference Engine (Plane 2): vLLM serving the model block from .env
# ==============================================================================
# Platform overlays set the image (vllm-openai / -rocm / -cpu) and the accelerator
# resource; the model, context length and model-specific flags come from the
# llmops-model ConfigMap (generated from .env), exactly as in docker-compose.
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weight-cache
spec:
  # ReadWriteOnce works on any cluster; use a ReadWriteMany class (EFS, Filestore,
  # CephFS) so replicas on several nodes share one weight cache.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
    plane: inference
spec:
  replicas: 1
  # First boot = image pull + weight download + kernel compilation: allow an hour.
  progressDeadlineSeconds: 3600
  # An accelerator cannot host the old and the new engine at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        plane: inference
    spec:
      terminationGracePeriodSeconds: 60
      # Kubernetes injects VLLM_PORT=tcp://<ip>:8000 for a Service named "vllm";
      # vLLM reads VLLM_PORT as its own setting and refuses to start.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0
          # Shell form so the multi-flag VLLM_MODEL_ARGS / VLLM_EXTRA_ARGS split into argv.
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec vllm serve "$MODEL_NAME"
              --revision "$MODEL_REVISION"
              --served-model-name "$SERVED_MODEL_NAME"
              --dtype "$MODEL_DTYPE"
              --max-model-len "$MAX_MODEL_LEN"
              --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION"
              --enable-prefix-caching
              --otlp-traces-endpoint http://tempo:4317
              --disable-access-log-for-endpoints /health,/metrics
              --host 0.0.0.0
              --port 8000
              $VLLM_MODEL_ARGS $VLLM_EXTRA_ARGS
          envFrom:
            - configMapRef:
                name: llmops-model
          env:
            - name: HF_TOKEN
              valueFrom: {secretKeyRef: {name: llmops-secrets, key: HF_TOKEN, optional: true}}
            - name: OTEL_SERVICE_NAME
              value: vllm-engine
          ports:
            - containerPort: 8000
              name: http
          # Weight download + kernel compilation can take many minutes on first boot.
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-weight-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
