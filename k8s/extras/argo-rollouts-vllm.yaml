# ==============================================================================
# Argo Rollouts Model Canary Specification (Plane 9: Model Lifecycle) - optional
# ==============================================================================
# Canary for a model / engine change, on clusters running Argo Rollouts + an NGINX
# ingress. Use instead of the base vllm Deployment (scale that one to 0):
#   1. Routes 10% of traffic to the candidate model block
#   2. Gates on the shared Prometheus SLO rules (P95 TTFT, gateway error rate)
#   3. Promotes to 50% -> 100%, or aborts and rolls back automatically
# The candidate reads the same llmops-model ConfigMap as the base Deployment; point
# the canary at a candidate ConfigMap to trial a different Hugging Face model.
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: vllm-model-rollout
  namespace: llmops
spec:
  replicas: 4
  strategy:
    canary:
      canaryService: vllm-canary
      stableService: vllm
      trafficRouting:
        nginx:
          stableIngress: vllm-ingress
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - analysis:
            templates:
              - templateName: llm-canary-slo-analysis
        - setWeight: 50
        - pause: { duration: 10m }
        - analysis:
            templates:
              - templateName: llm-canary-slo-analysis
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec vllm serve "$MODEL_NAME"
              --revision "$MODEL_REVISION"
              --served-model-name "$SERVED_MODEL_NAME"
              --dtype "$MODEL_DTYPE"
              --max-model-len "$MAX_MODEL_LEN"
              --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION"
              --enable-prefix-caching
              --otlp-traces-endpoint http://tempo:4317
              --host 0.0.0.0 --port 8000
              $VLLM_MODEL_ARGS $VLLM_EXTRA_ARGS
          envFrom:
            - configMapRef:
                name: llmops-model
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: llm-canary-slo-analysis
  namespace: llmops
spec:
  metrics:
    # 1. P95 TTFT must stay under 1.5s
    - name: canary-ttft-p95
      interval: 30s
      count: 5
      successCondition: result[0] <= 1.5
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.llmops.svc.cluster.local:9090
          query: job:vllm_time_to_first_token_seconds_p95

    # 2. Error rate must stay under 0.5%
    - name: canary-error-rate
      interval: 30s
      count: 5
      successCondition: result[0] <= 0.5
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.llmops.svc.cluster.local:9090
          query: job:litellm_error_rate_percent
