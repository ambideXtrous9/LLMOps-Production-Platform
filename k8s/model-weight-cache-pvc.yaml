# ==============================================================================
# Model Weight Cache Specification (Plane 2 & 8)
# ==============================================================================
# Solves slow cold-starts during scale-out events.
# Provides a shared PersistentVolumeClaim / ReadWriteMany volume so newly
# provisioned GPU worker pods load weights instantly without internet downloading.
# ==============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-model-weight-cache
  namespace: llmops
spec:
  accessModes:
    - ReadWriteMany                              # Mounted concurrently across all vLLM replicas
  resources:
    requests:
      storage: 100Gi
  storageClassName: efs-sc                       # AWS EFS / GCP Filestore / CephFS ReadWriteMany provisioner
