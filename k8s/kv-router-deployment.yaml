# ==============================================================================
# KV-Cache-Aware Intelligent Router (Plane 1 & 2)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-router-deployment
  namespace: llmops
  labels:
    app: kv-router
    plane: routing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kv-router
  template:
    metadata:
      labels:
        app: kv-router
    spec:
      containers:
        - name: kv-router
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir aiohttp
              cat << 'EOF' > /app/kv_router.py
              # Embedded KV Router script
              import asyncio, hashlib, json, logging, os, time
              from aiohttp import ClientSession, ClientTimeout, web

              PORT = int(os.getenv("ROUTER_PORT", "8000"))
              BACKENDS = os.getenv("VLLM_BACKENDS", "http://vllm-service:8000").split(",")
              logger = logging.getLogger("kv-router")
              logging.basicConfig(level=logging.INFO)

              async def handle_proxy(request):
                  body = await request.read()
                  try:
                      payload = json.loads(body)
                      prefix = payload.get("messages", [{}])[0].get("content", "")[:256]
                  except Exception:
                      prefix = ""
                  idx = int(hashlib.sha256(prefix.encode()).hexdigest(), 16) % len(BACKENDS)
                  target = f"{BACKENDS[idx].strip()}{request.path}"
                  headers = {k: v for k, v in request.headers.items() if k.lower() not in ("host", "content-length")}
                  async with ClientSession(timeout=ClientTimeout(total=60)) as sess:
                      async with sess.request(request.method, target, data=body, headers=headers) as upstream:
                          resp = web.StreamResponse(status=upstream.status, headers=upstream.headers)
                          await resp.prepare(request)
                          async for chunk in upstream.content.iter_any():
                              await resp.write(chunk)
                          await resp.write_eof()
                          return resp

              async def handle_health(request):
                  return web.json_response({"status": "ok", "backends": BACKENDS})

              app = web.Application()
              app.router.add_get("/health", handle_health)
              app.router.add_route("*", "/{tail:.*}", handle_proxy)
              web.run_app(app, host="0.0.0.0", port=PORT)
              EOF
              python /app/kv_router.py
          env:
            - name: ROUTER_PORT
              value: "8000"
            - name: VLLM_BACKENDS
              value: "http://vllm-service:8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kv-router-service
  namespace: llmops
spec:
  selector:
    app: kv-router
  ports:
    - name: http
      port: 8000
      targetPort: 8000
