# ==============================================================================
# LLMOps - base stack: gateway, state and observability
# ==============================================================================
# The inference engine (vLLM) comes from an overlay in compose/, picked by run_all.sh:
#   compose/vllm.yml     vLLM OpenAI server in Docker (NVIDIA, AMD ROCm, CPU)
#   compose/native.yml   Apple Silicon: vllm-metal runs on the host, outside Docker
# plus a device overlay when needed (compose/nvidia.yml, compose/rocm.yml).
# run_all.sh saves the chosen list as COMPOSE_FILE in .env, so plain
# `docker compose ps | logs | restart` work afterwards.
#
# Exposure: the gateway and Grafana bind to PUBLIC_BIND_ADDRESS, everything else to
# BIND_ADDRESS (both 127.0.0.1 by default). Postgres, Redis and Loki stay on the
# Docker network.
# Memory: every container has a limit (engine and gateway sized by run_all.sh from the
# RAM available), so a runaway container is killed and restarted instead of the host.
# ==============================================================================

name: llmops

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # --------------------------------------------------------------------------
  # Gateway: one OpenAI-compatible endpoint with keys, retries, cache, metrics
  # --------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.104.1}
    container_name: llmops-litellm
    mem_limit: ${LITELLM_MEM_LIMIT:-4g}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run ./run_all.sh to create .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-llmops_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litellm_db}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-llm}
      # where the engine's OpenAI API listens (compose/native.yml points it at the host)
      ENGINE_API_BASE: http://engine:8000/v1
      # unauthenticated metrics for Prometheus on a port that is never published
      PROMETHEUS_METRICS_PORT: "9095"
    # config.yaml names the model __SERVED_MODEL_NAME__: filled in at start
    entrypoint:
      - /bin/sh
      - -c
      - sed "s|__SERVED_MODEL_NAME__|$$SERVED_MODEL_NAME|g" /app/config.yaml > /tmp/litellm.yaml && exec docker/prod_entrypoint.sh "$$@"
      - litellm
    command: ["--config", "/tmp/litellm.yaml", "--port", "4000", "--num_workers", "${LITELLM_NUM_WORKERS:-2}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s
    labels:
      autoheal: "true"
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: llmops-postgres
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-litellm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmops_admin} -d ${POSTGRES_DB:-litellm_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: llmops-redis
    mem_limit: 768m
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *logging

  # --------------------------------------------------------------------------
  # Observability: Prometheus (metrics + alert rules), Loki + Alloy (logs), Grafana
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    container_name: llmops-prometheus
    mem_limit: 2g
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # directory mount: edits are picked up by `curl -X POST localhost:9090/-/reload`
      - ./config/prometheus:/etc/prometheus/llmops:ro
      - prometheus_data:/prometheus
      # engine / GPU scrape jobs are mounted into /etc/prometheus/scrape.d by the overlays
    command:
      - --config.file=/etc/prometheus/llmops/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *logging

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.0.0}
    container_name: llmops-loki
    mem_limit: 1g
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    logging: *logging

  alloy:
    # ships the logs of every container of this stack to Loki
    image: grafana/alloy:${ALLOY_VERSION:-v1.1.0}
    container_name: llmops-alloy
    mem_limit: 512m
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/tmp/alloy"]
    depends_on:
      - loki
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.0}
    container_name: llmops-node-exporter
    mem_limit: 256m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    container_name: llmops-grafana
    mem_limit: 1g
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/llm-serving.json
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    logging: *logging

  # --------------------------------------------------------------------------
  # Self-healing: restarts any container labelled autoheal=true that turns unhealthy
  # (Docker itself only restarts containers that exit)
  # --------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:${AUTOHEAL_VERSION:-1.2.0}
    container_name: llmops-autoheal
    mem_limit: 128m
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  engine_cache:
