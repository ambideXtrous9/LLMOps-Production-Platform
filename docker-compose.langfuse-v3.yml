# ==============================================================================
# Langfuse v3 Enterprise Stack Overlay (Plane 6)
# ==============================================================================
# Upgrades from Langfuse v2 (Postgres-only) to full production Langfuse v3:
#  - ClickHouse: Columnar storage for sub-second analytical queries over billions of tokens
#  - MinIO: S3-compatible object store for raw trace payloads and LLM evaluations
#  - Redis: Distributed cache and background asynchronous evaluation workers
#  - PostgreSQL: Relational metadata, auth, and virtual key links
# ==============================================================================

services:
  # Langfuse v3 Web / Application Server (Overrides v2 in docker-compose.yml)
  langfuse:
    image: langfuse/langfuse:3
    container_name: langfuse-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-llmops_admin}:${POSTGRES_PASSWORD:-llmops_production_secure_pass_2026}@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-sec-nextauth-token-984729104827104928}
      - SALT=${LANGFUSE_SALT:-sec-salt-83920194857291048572910485}
      - TELEMETRY_ENABLED=false
      # ClickHouse Integration
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_production_pass_2026}
      - CLICKHOUSE_DATABASE=langfuse
      # Redis Integration
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_cluster_production_pass_2026}@redis:6379
      # S3 / MinIO Blob Storage Integration
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioproductionpass2026}
      - S3_BUCKET_NAME=${MINIO_BUCKET:-langfuse-traces}
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - llmops-net

  # ClickHouse Columnar Database (v3 Traces & Evaluations)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: langfuse-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_production_pass_2026}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - llmops-net

  # MinIO S3-Compatible Object Store (v3 Raw Payload Blobs)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: langfuse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioproductionpass2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - llmops-net

volumes:
  clickhouse_data:
  minio_data:
