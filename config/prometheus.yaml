# ==============================================================================
# Prometheus Production Scraper Configuration (Plane 3)
# ==============================================================================
# Scrape interval tuned to 15s to balance metric resolution with multi-target
# overhead. Recording rules pre-compute golden signals for KEDA autoscaling
# and Grafana dashboards.
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yaml
  - /etc/prometheus/rules/prometheus-alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Inference Engine: vLLM Worker Metrics
  - job_name: "vllm"
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
    relabel_configs:
      - target_label: plane
        replacement: gpu-inference

  # AI Gateway: LiteLLM Proxy Metrics
  - job_name: "litellm"
    metrics_path: /metrics/
    bearer_token: "sk-admin-master-sec-9a8b7c6d5e4f3a2b1c0d"
    static_configs:
      - targets: ["litellm:4000"]
    relabel_configs:
      - target_label: plane
        replacement: ingress-gateway

  # Routing Plane: KV-Cache-Aware Intelligent Router
  - job_name: "kv-router"
    metrics_path: /metrics
    static_configs:
      - targets: ["kv-router:8000"]
    relabel_configs:
      - target_label: plane
        replacement: kv-routing

  # Hardware Telemetry: NVIDIA DCGM Exporter
  - job_name: "dcgm"
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm-exporter:9400"]
    relabel_configs:
      - target_label: plane
        replacement: gpu-hardware

  # Host System Telemetry: Node Exporter
  - job_name: "node-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - target_label: plane
        replacement: host-infrastructure

  # Logs & Telemetry Agent: Grafana Alloy
  - job_name: "alloy"
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
    relabel_configs:
      - target_label: plane
        replacement: telemetry-shipper

  # Distributed Tracing: Grafana Tempo
  - job_name: "tempo"
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]
    relabel_configs:
      - target_label: plane
        replacement: distributed-tracing

  # Alerting Plane: Alertmanager
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
