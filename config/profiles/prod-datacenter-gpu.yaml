# ==============================================================================
# Hardware Serving Profile: Datacenter GPU (NVIDIA A100 / L40S / H100, AMD MI-series)
# ==============================================================================
# Engine: vLLM (vllm/vllm-openai, docker-compose.gpu.yml; ROCm: docker-compose.rocm.yml)
# Default preset: qwen3.5-9b for >= 24 GB, qwen3-4b for 10-24 GB
# Verified: 1x A100-SXM4-40GB, vLLM v0.31.0
# Informational: the engine is configured by the .env model block.
# ==============================================================================

engine: vllm
profile_name: prod-datacenter-gpu
target_hardware:
  gpu_family: "NVIDIA A100 / L40S / H100 (AMD Instinct via ROCm overlay)"
  vram_total_mib: ">= 24576"
  supported_precision: ["bfloat16", "fp8", "mxfp4", "awq", "gptq"]

serving_parameters:
  preset: qwen3.5-9b
  dtype: auto                    # BF16 on Ampere+
  gpu_memory_utilization: 0.90
  max_model_len: 131072          # Qwen recommends >= 128K for thinking quality
  enforce_eager: false           # CUDA graphs + torch.compile (cache persisted in volumes)
  enable_prefix_caching: true    # hybrid models use mamba cache mode "align"

observed_performance:            # A100-SXM4-40GB
  qwen3.5-9b: {weights_gib: 17.7, kv_cache_tokens: 410692, decode_tokens_per_s_per_stream: 74, burst32_tokens_per_s: 1452, cold_boot_s: 205, warm_boot_s: 80}
  gpt-oss-20b: {decode_tokens_per_s_per_stream: 84, burst32_tokens_per_s: 1912}

telemetry:
  otlp_traces_endpoint: "http://alloy:4317"
  dcgm_profiling_supported: true
