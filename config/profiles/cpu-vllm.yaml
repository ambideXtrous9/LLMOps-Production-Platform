# ==============================================================================
# Hardware Serving Profile: CPU (x86_64 / arm64, no accelerator)
# ==============================================================================
# Engine: vLLM CPU backend (vllm/vllm-openai-cpu, docker-compose.cpu.yml)
# Default preset: qwen3-4b (models/presets/qwen3-4b.env)
# Verified: 30 vCPU AMD EPYC 7J13 (AVX2, no AVX-512), vLLM v0.31.0
# Informational: the engine is configured by the .env model block.
# ==============================================================================

engine: vllm-cpu
profile_name: cpu-vllm
target_hardware:
  isa: ["avx2", "avx512 (faster)", "arm64 neon"]
  memory: "weights (BF16 = 2 bytes/param) + VLLM_CPU_KVCACHE_SPACE GiB"

serving_parameters:
  preset: qwen3-4b
  kv_cache_space_gib: 8          # VLLM_CPU_KVCACHE_SPACE
  max_model_len: auto            # largest context that fits the KV space
  omp_threads_bind: auto         # VLLM_CPU_OMP_THREADS_BIND

observed_performance:
  qwen3-4b: {decode_tokens_per_s_per_stream: 9.9, ttft_p95_s: 1.67, eval_gate: "8/8"}
  qwen3-1.7b: {eval_gate: "4/8 (rejected)"}
  first_request_jit_s: 69        # absorbed by run_all.sh warm-up request
