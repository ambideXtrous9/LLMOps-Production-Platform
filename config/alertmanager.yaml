# ==============================================================================
# Alertmanager Production Routing & Notification Configuration (Plane 3)
# ==============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service', 'slo']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 3h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        slo: ttft
      receiver: 'slo-channel'

inhibit_rules:
  # If a service instance is completely down, suppress its latency & queue alerts
  - source_match:
      alertname: 'LLMServiceInstanceDown'
    target_match_re:
      alertname: 'LLMHighTTFT.*|LLMQueueBacklogSaturation'
    equal: ['instance']

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true

  - name: 'slo-channel'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/slo'
        send_resolved: true
