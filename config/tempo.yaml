# ==============================================================================
# Grafana Tempo Distributed Tracing Configuration (Plane 5)
# ==============================================================================
# Ingests spans from LiteLLM and vLLM to enable end-to-end trace correlation:
# Client -> Gateway -> KV Router -> vLLM PagedAttention / Token Generation.
# ==============================================================================

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
