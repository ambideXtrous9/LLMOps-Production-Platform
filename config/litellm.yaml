# ==============================================================================
# LiteLLM AI Gateway Hardened Production Configuration (Plane 1)
# ==============================================================================
# Enforces:
#  - Virtual key authentication via PostgreSQL persistence
#  - Redis distributed rate-limiting & response caching
#  - Input guardrail: PII masking before the model sees the prompt (pii_guardrail.py)
#  - OpenTelemetry W3C traceparent propagation to Tempo (OTEL_* env, see compose)
#  - Prometheus golden signal callbacks
#  - Dynamic fallback routing & retries
#
# This file is gateway POLICY only. Routes to the self-hosted vLLM engine are
# generated at container start by config/render_litellm_config.py from the model
# settings in .env (SERVED_MODEL_NAME, MODEL_SUPPORTS_*, ...):
#     <served-name>            -> KV-cache-aware router -> vLLM
#     <served-name>-direct     -> vLLM (fallback, bypasses the router)
#     <served-name>-thinking   -> reasoning mode (reasoning-capable models only)
# so switching to any Hugging Face model needs no edit here.
# ==============================================================================

# Optional extra routes (kept alongside the generated engine routes), e.g. a
# hosted provider as overflow capacity:
# model_list:
#   - model_name: gpt-4o-mini
#     litellm_params:
#       model: openai/gpt-4o-mini
#       api_key: os.environ/OPENAI_API_KEY

router_settings:
  routing_strategy: "least-busy"
  enable_pre_call_checks: true
  num_retries: 2
  timeout: 600
  # fallbacks: <served-name> -> <served-name>-direct is added automatically

guardrails:
  - guardrail_name: "pii-masking"
    litellm_params:
      guardrail: pii_guardrail.PIIMaskingGuardrail
      mode: "pre_call"
      default_on: true

litellm_settings:
  # /metrics on the gateway port needs a key (it lists teams, key aliases and spend);
  # Prometheus scrapes the separate internal metrics port (PROMETHEUS_METRICS_PORT).
  require_auth_for_metrics_endpoint: true

  # Multi-telemetry egress: Prometheus golden signals, OTLP spans via Alloy -> Tempo,
  # and LLM traces (prompts, completions, tokens, cost) to Langfuse over OTLP
  callbacks: ["prometheus", "otel", "langfuse_otel"]
  # Pass the caller's W3C traceparent on to the router / vLLM so engine spans join the
  # same Tempo trace as the gateway spans (LiteLLM's default is to drop it).
  forward_traceparent_to_llm_provider: true

  # Distributed Redis exact-response cache (connection from REDIS_URL).
  # Clients bypass it per request with {"cache": {"no-cache": true}}.
  cache: true
  cache_params:
    type: "redis"
    namespace: "litellm.cache"
    ttl: 3600
    supported_call_types: ["acompletion", "completion"]

general_settings:
  # Master key loaded strictly from environment secret (ADMIN ONLY)
  master_key: os.environ/LITELLM_MASTER_KEY

  # Relational Database for per-team virtual keys, spend budgets, & audit log
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: false  # PII protection: don't store raw prompts in DB logs
