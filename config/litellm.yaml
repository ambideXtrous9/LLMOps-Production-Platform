# ==============================================================================
# LiteLLM AI Gateway Hardened Production Configuration (Plane 1)
# ==============================================================================
# Enforces:
#  - Virtual key authentication via PostgreSQL persistence
#  - Redis distributed rate-limiting & response caching
#  - Input/Output Guardrails (PII redaction, prompt injection heuristics)
#  - OpenTelemetry W3C traceparent propagation to Tempo
#  - Prometheus golden signal callbacks
#  - Dynamic fallback routing & retries
# ==============================================================================

model_list:
  # Primary Serving Route: KV-Cache-Aware Router -> vLLM Workers
  - model_name: smollm2
    litellm_params:
      model: openai/HuggingFaceTB/SmolLM2-360M-Instruct
      api_base: os.environ/KV_ROUTER_URL
      api_key: "none"
      timeout: 30
      max_retries: 3
      stream: true

  # Direct vLLM Engine Route (Bypasses Router for debugging / fallback)
  - model_name: smollm2-direct
    litellm_params:
      model: openai/HuggingFaceTB/SmolLM2-360M-Instruct
      api_base: os.environ/VLLM_DIRECT_URL
      api_key: "none"
      timeout: 30
      max_retries: 2
      stream: true

  # Alternate Engine Heterogeneity Route (Pluggable CPU/Edge engine fallback)
  - model_name: smollm2-edge-fallback
    litellm_params:
      model: openai/SmolLM2-360M-Instruct
      api_base: os.environ/EDGE_FALLBACK_URL
      api_key: "none"
      timeout: 45
      max_retries: 1

router_settings:
  routing_strategy: "least-busy"
  enable_pre_call_checks: true
  num_retries: 3
  timeout: 30
  fallbacks:
    - smollm2: ["smollm2-direct"]

litellm_settings:
  # Internal Prometheus scraper access within docker network
  require_auth_for_metrics_endpoint: false

  # Multi-telemetry egress (Prometheus golden signals + Tempo OTel)
  # To enable Langfuse application tracing, set LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, and add "langfuse"
  success_callback: ["prometheus", "otel"]
  failure_callback: ["prometheus", "otel"]

  # Distributed Redis Caching (Exact response cache & prefix hits)
  cache: true
  cache_type: "redis"
  redis_url: os.environ/REDIS_URL
  cache_params:
    namespace: "litellm.cache"
    ttl: 3600
    supported_call_types: ["acompletion", "completion"]

  # OpenTelemetry Distributed Tracing
  otel:
    endpoint: os.environ/OTEL_EXPORTER_OTLP_ENDPOINT
    service_name: "litellm-gateway"
    export_interval_millis: 500


general_settings:
  # Master key loaded strictly from environment secret (ADMIN ONLY)
  master_key: os.environ/LITELLM_MASTER_KEY

  # Relational Database for per-team virtual keys, spend budgets, & audit log
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  proxy_budget_resets: "monthly"
  store_prompts_in_spend_logs: false  # PII protection: don't store raw prompts in DB logs
  enable_proxy_cache: true
  trusted_proxy_ranges: []
