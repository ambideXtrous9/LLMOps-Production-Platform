# ==============================================================================
# LiteLLM gateway: one OpenAI-compatible endpoint in front of the engine
# ==============================================================================
# __SERVED_MODEL_NAME__ is replaced at container start (SERVED_MODEL_NAME in .env);
# ENGINE_API_BASE: the vLLM container (engine:8000) or, on Apple Silicon, the host.
# ==============================================================================

model_list:
  - model_name: __SERVED_MODEL_NAME__
    litellm_params:
      model: hosted_vllm/__SERVED_MODEL_NAME__
      api_base: os.environ/ENGINE_API_BASE
      api_key: none
      timeout: 600
  # Add more deployments under the same model_name to load-balance (with failover)
  # across several engines, or a hosted model as overflow, e.g.:
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

router_settings:
  # Resilience: transient engine errors (restart, overload) are retried, client errors are not
  num_retries: 2
  timeout: 600
  retry_policy:
    TimeoutErrorRetries: 1
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  # Prometheus metrics: requests, latency, TTFT, tokens and failures per key and model
  callbacks: ["prometheus"]
  # /metrics on the (possibly public) gateway port needs a key; Prometheus reads the
  # internal port PROMETHEUS_METRICS_PORT instead
  require_auth_for_metrics_endpoint: true
  # parameters the engine does not support are dropped instead of failing the request
  drop_params: true
  request_timeout: 600
  json_logs: true

  # Exact-match response cache in Redis, opt-in per request: {"cache": {"use-cache": true}}
  # answers a repeated request without the engine. Off by default: answers are sampled, so a
  # repeated prompt should get a fresh generation (and real latency in the logs).
  cache: true
  cache_params:
    type: redis
    namespace: llmops
    mode: default_off
    ttl: 3600
    supported_call_types: ["acompletion", "atext_completion"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # virtual keys, budgets, rate limits and spend tracking
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 5
  # keep request and response bodies with each log entry (Logs page in the gateway UI)
  store_prompts_in_spend_logs: true
