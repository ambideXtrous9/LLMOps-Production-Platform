    architecture:
      family: "llama"
      parameter_count: "3.2B"
      max_context_length: 8192
    serving:
      engine: "vllm-metal"
      framework: "mlx"
      precision: "4bit"
      quantization: "mlx-4bit"
      gpu_target_profile: "apple-silicon-metal"
      unified_memory_budget_gb: 3.5
      tensor_parallel: 1
    eval_thresholds:
      min_golden_accuracy: 0.90
      max_ttft_p95_seconds: 1.0
      min_generation_tps: 35.0

  # ----------------------------------------------------------------------------
