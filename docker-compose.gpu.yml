# ==============================================================================
# NVIDIA CUDA Platform Overlay
# ==============================================================================
# Applied automatically by run_all.sh when an NVIDIA GPU with container runtime is
# detected (fresh host: run scripts/bootstrap_host.sh first). The engine command and
# model come from docker-compose.yml + .env; this overlay only adds the CUDA image,
# the GPU reservation and NVIDIA's DCGM exporter.
#
# First boot downloads the weights and compiles CUDA graphs (several minutes);
# torch.compile / Triton caches live in named volumes so restarts are fast.
# ==============================================================================

services:
  vllm:
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.31.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:${DCGM_EXPORTER_TAG:-4.5.2-4.8.1-ubuntu22.04}
    build: !reset null
    environment: !reset []
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
