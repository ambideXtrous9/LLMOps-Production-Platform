# ==============================================================================
# Apple Silicon (Metal) Platform Overlay
# ==============================================================================
# Containers on macOS cannot reach the Metal GPU, so the engine runs natively on the
# host with vllm-metal (`python3 scripts/serve_metal.py`, same model block from .env)
# and this overlay bridges it into the docker network as vllm:8000. The KV router,
# LiteLLM gateway, Prometheus scrape and every test keep their usual wiring.
#
# Hardware telemetry: the exporter stub reports the platform without GPU samples.
# ==============================================================================

services:
  vllm:
    image: alpine/socat:1.8.1.3
    command:
      - TCP-LISTEN:8000,fork,reuseaddr
      - TCP:host.docker.internal:${METAL_ENGINE_PORT:-8000}
    # The native engine already owns the host port; the bridge is internal-only.
    ports: !reset []
    volumes: !reset []
    environment: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health"]
      start_period: 30s
